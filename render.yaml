services:
  - type: web
    name: weather-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
    disk:
      name: weather-data
      mountPath: /app/data
      sizeGB: 1
